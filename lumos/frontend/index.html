<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI BDA Agent System — Lumos Learning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0c0f;
  --bg2: #111417;
  --bg3: #181c21;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --text: #e8eaed;
  --muted: #7a8290;
  --accent: #00e5a0;
  --accent2: #0077ff;
  --warn: #f5a623;
  --danger: #ff4d4d;
  --purple: #a78bfa;
  --font-display: 'Syne', sans-serif;
  --font-body: 'DM Sans', sans-serif;
  --font-mono: 'DM Mono', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 14px; overflow: hidden; }

/* Layout */
.app { display: grid; grid-template-columns: 240px 1fr; grid-template-rows: 52px 1fr; height: 100vh; }

/* Top bar */
.topbar {
  grid-column: 1/-1;
  display: flex; align-items: center; gap: 12px;
  padding: 0 20px;
  border-bottom: 1px solid var(--border);
  background: var(--bg2);
}
.logo { font-family: var(--font-display); font-size: 15px; font-weight: 700; letter-spacing: .02em; color: var(--text); display: flex; align-items: center; gap: 8px; }
.logo-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: blink 2s ease-in-out infinite; }
@keyframes blink { 0%,100% { opacity:1; } 50% { opacity:.3; } }
.topbar-badge { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--muted); background: var(--bg3); border: 1px solid var(--border); border-radius: 4px; padding: 3px 8px; }
.stat-chips { display: flex; gap: 8px; margin-left: 24px; }
.chip { font-family: var(--font-mono); font-size: 11px; padding: 3px 10px; border-radius: 4px; border: 1px solid var(--border); background: var(--bg3); }
.chip span { font-weight: 500; }
.chip.green span { color: var(--accent); }
.chip.red span { color: var(--danger); }
.chip.blue span { color: var(--accent2); }

/* Sidebar */
.sidebar {
  background: var(--bg2);
  border-right: 1px solid var(--border);
  padding: 16px 12px;
  overflow-y: auto;
  display: flex; flex-direction: column; gap: 8px;
}
.sidebar-label { font-family: var(--font-mono); font-size: 10px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; padding: 0 8px; margin-bottom: 4px; margin-top: 8px; }
.lead-card {
  padding: 10px 12px;
  border-radius: 8px;
  border: 1px solid var(--border);
  cursor: pointer;
  transition: all .15s;
  background: transparent;
}
.lead-card:hover { border-color: var(--border2); background: var(--bg3); }
.lead-card.active { border-color: var(--accent); background: rgba(0,229,160,.05); }
.lead-card.junk { border-color: rgba(255,77,77,.3); opacity: .7; }
.lead-card.done { border-color: rgba(0,229,160,.3); }
.lead-email { font-family: var(--font-mono); font-size: 11px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lead-name { font-size: 11px; color: var(--muted); margin-top: 3px; }
.lead-status { display: inline-block; font-size: 10px; margin-top: 5px; padding: 2px 7px; border-radius: 3px; font-family: var(--font-mono); }
.status-pending { background: rgba(122,130,144,.1); color: var(--muted); }
.status-running { background: rgba(245,166,35,.1); color: var(--warn); }
.status-done { background: rgba(0,229,160,.1); color: var(--accent); }
.status-junk { background: rgba(255,77,77,.1); color: var(--danger); }
.status-review { background: rgba(0,119,255,.1); color: var(--accent2); }

/* Main */
.main { padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }

/* Pipeline viz */
.pipeline-track {
  display: flex; align-items: center; gap: 0;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 18px;
  overflow-x: auto;
}
.pipe-step { display: flex; align-items: center; gap: 0; }
.pipe-node {
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  min-width: 72px;
}
.pipe-circle {
  width: 34px; height: 34px; border-radius: 50%;
  border: 1px solid var(--border2);
  background: var(--bg3);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  transition: all .3s;
  position: relative;
}
.pipe-circle.done { border-color: var(--accent); background: rgba(0,229,160,.1); color: var(--accent); }
.pipe-circle.running { border-color: var(--warn); background: rgba(245,166,35,.1); animation: spin-ring 1s linear infinite; }
.pipe-circle.failed { border-color: var(--danger); background: rgba(255,77,77,.1); }
@keyframes spin-ring {
  0% { box-shadow: 0 0 0 2px rgba(245,166,35,.8), 0 0 0 4px rgba(245,166,35,.3); }
  50% { box-shadow: 0 0 0 2px rgba(245,166,35,.3), 0 0 0 6px rgba(245,166,35,.1); }
  100% { box-shadow: 0 0 0 2px rgba(245,166,35,.8), 0 0 0 4px rgba(245,166,35,.3); }
}
.pipe-label { font-family: var(--font-mono); font-size: 9px; color: var(--muted); text-align: center; line-height: 1.3; }
.pipe-connector { width: 28px; height: 1px; background: var(--border); flex-shrink: 0; position: relative; top: -10px; }
.pipe-connector.done { background: var(--accent); opacity: .4; }

/* Controls */
.controls { display: flex; gap: 10px; align-items: center; }
.btn-run {
  display: flex; align-items: center; gap: 7px;
  background: var(--accent);
  color: #000;
  border: none;
  padding: 9px 20px;
  border-radius: 7px;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 13px;
  cursor: pointer;
  transition: all .15s;
  letter-spacing: .01em;
}
.btn-run:hover { background: #00ffb3; transform: translateY(-1px); }
.btn-run:disabled { opacity: .4; cursor: not-allowed; transform: none; }
.btn-reset {
  display: flex; align-items: center; gap: 7px;
  background: transparent;
  color: var(--muted);
  border: 1px solid var(--border);
  padding: 9px 16px;
  border-radius: 7px;
  font-family: var(--font-body);
  font-size: 13px;
  cursor: pointer;
  transition: all .15s;
}
.btn-reset:hover { border-color: var(--border2); color: var(--text); }
.run-hint { font-family: var(--font-mono); font-size: 11px; color: var(--muted); margin-left: 4px; }

/* Agent log cards */
.agent-grid { display: flex; flex-direction: column; gap: 10px; }
.agent-block {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  animation: slideIn .2s ease;
}
@keyframes slideIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
.agent-block.active { border-color: rgba(245,166,35,.3); }
.agent-block.done-ok { border-color: rgba(0,229,160,.2); }
.agent-block.done-junk { border-color: rgba(255,77,77,.2); }
.agent-head {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 14px;
  border-bottom: 1px solid var(--border);
}
.agent-icon { width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; }
.agent-name { font-family: var(--font-display); font-size: 13px; font-weight: 600; color: var(--text); }
.agent-badge { margin-left: auto; font-family: var(--font-mono); font-size: 10px; padding: 2px 8px; border-radius: 3px; }
.badge-running { background: rgba(245,166,35,.1); color: var(--warn); }
.badge-ok { background: rgba(0,229,160,.1); color: var(--accent); }
.badge-junk { background: rgba(255,77,77,.1); color: var(--danger); }
.badge-review { background: rgba(0,119,255,.1); color: var(--accent2); }
.agent-logs { padding: 10px 14px; display: flex; flex-direction: column; gap: 0; }
.log-row {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 4px 0;
  border-bottom: 1px solid rgba(255,255,255,.03);
  font-size: 12px; line-height: 1.5;
}
.log-row:last-child { border-bottom: none; }
.log-ts { font-family: var(--font-mono); font-size: 10px; color: var(--muted); flex-shrink: 0; margin-top: 1px; }
.log-dot { flex-shrink: 0; margin-top: 5px; width: 5px; height: 5px; border-radius: 50%; }
.dot-ok { background: var(--accent); }
.dot-wait { background: var(--warn); }
.dot-fail { background: var(--danger); }
.log-msg { color: var(--text); }
.log-msg.dim { color: var(--muted); }

/* Data block inside agent */
.data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; }
.data-cell { background: var(--bg3); border-radius: 6px; padding: 8px 10px; border: 1px solid var(--border); }
.data-key { font-family: var(--font-mono); font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.data-val { font-size: 12px; font-weight: 500; color: var(--text); margin-top: 3px; }
.conf-bar { height: 3px; border-radius: 2px; background: var(--bg3); margin-top: 8px; overflow: hidden; }
.conf-fill { height: 100%; border-radius: 2px; background: var(--accent); transition: width .6s ease; }

/* Email preview */
.email-preview {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px 14px;
  font-family: var(--font-mono);
  font-size: 11px;
  line-height: 1.8;
  color: #c8d0dc;
  white-space: pre-line;
  margin-top: 10px;
  max-height: 260px;
  overflow-y: auto;
}
.email-subject { font-family: var(--font-display); font-size: 12px; font-weight: 600; color: var(--accent2); margin-top: 10px; margin-bottom: 4px; }

/* Empty state */
.empty {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 300px;
  border: 1px dashed var(--border);
  border-radius: 10px;
  gap: 10px;
}
.empty-icon { font-size: 32px; opacity: .3; }
.empty-text { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }

/* Scrollbars */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 10px; }
</style>
</head>
<body>

<div class="app">
  <!-- Top bar -->
  <div class="topbar">
    <div class="logo"><div class="logo-dot"></div>AI BDA Agent System</div>
    <div class="stat-chips">
      <div class="chip green">Processed: <span id="stat-done">0</span></div>
      <div class="chip red">Junk: <span id="stat-junk">0</span></div>
      <div class="chip blue">Quotes: <span id="stat-quotes">0</span></div>
    </div>
    <div class="topbar-badge" id="backend-status">backend: checking…</div>
  </div>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-label">Lead queue</div>
    <div id="leads-list"></div>
  </div>

  <!-- Main panel -->
  <div class="main" id="main">
    <div class="pipeline-track" id="pipeline-track"></div>
    <div class="controls">
      <button class="btn-run" id="run-btn" onclick="runPipeline()">▶ Run pipeline</button>
      <button class="btn-reset" onclick="resetAll()">↺ Reset all</button>
      <span class="run-hint" id="run-hint">Select a lead to begin</span>
    </div>
    <div class="agent-grid" id="agent-grid">
      <div class="empty">
        <div class="empty-icon">⬡</div>
        <div class="empty-text">select a lead → run pipeline</div>
      </div>
    </div>
  </div>
</div>

<script>
const API = 'http://localhost:8000';

const AGENTS = [
  { id: 'intake_agent',     label: 'Intake',     icon: '⬇', color: '#00e5a0' },
  { id: 'research_agent',   label: 'Research',   icon: '🔍', color: '#0077ff' },
  { id: 'validation_agent', label: 'Validate',   icon: '✦',  color: '#f5a623' },
  { id: 'crm_agent',        label: 'CRM',        icon: '🗄', color: '#a78bfa' },
  { id: 'lumos_agent',      label: 'Lumos',      icon: '👤', color: '#ff6eb4' },
  { id: 'quote_agent',      label: 'Quote',      icon: '📄', color: '#00e5a0' },
  { id: 'qa_agent',         label: 'QA',         icon: '✓',  color: '#00e5a0' },
  { id: 'email_agent',      label: 'Email',      icon: '✉',  color: '#0077ff' },
];

let leads = [];
let selectedId = null;
let isRunning = false;
let leadStatuses = {};
let stats = { done: 0, junk: 0, quotes: 0 };
let activeAgentIndex = -1;
let doneAgentIndices = new Set();

// ── Fetch leads from backend ──────────────────────
async function init() {
  try {
    const r = await fetch(`${API}/leads`);
    leads = await r.json();
    leads.forEach(l => leadStatuses[l.id] = l.status || 'pending');
    document.getElementById('backend-status').textContent = 'backend: connected ✓';
    document.getElementById('backend-status').style.color = '#00e5a0';
  } catch (e) {
    document.getElementById('backend-status').textContent = 'backend: offline — start uvicorn';
    document.getElementById('backend-status').style.color = '#ff4d4d';
    // Use demo leads if offline
    leads = [
      { id:'1', email:'sarah.johnson@austinisd.org', name:'Sarah Johnson', state:'TX', status:'pending' },
      { id:'2', email:'mike.chen@gmail.com', name:'Mike Chen', state:'', status:'pending' },
      { id:'3', email:'admin@norwalkps.org', name:'', school:'Norwalk PS', state:'CT', status:'pending' },
      { id:'4', email:'d.patel@clevelandmetroschools.org', name:'D. Patel', school:'Cleveland Metro', state:'OH', status:'pending' },
      { id:'5', email:'jane@hotmail.com', name:'Jane', state:'', status:'pending' },
    ];
    leads.forEach(l => leadStatuses[l.id] = 'pending');
  }
  renderPipeline();
  renderLeads();
}

// ── Pipeline track ────────────────────────────────
function renderPipeline() {
  const el = document.getElementById('pipeline-track');
  el.innerHTML = '';
  AGENTS.forEach((a, i) => {
    if (i > 0) {
      const conn = document.createElement('div');
      conn.className = 'pipe-connector' + (doneAgentIndices.has(i - 1) ? ' done' : '');
      el.appendChild(conn);
    }
    const step = document.createElement('div');
    step.className = 'pipe-step';
    let cls = '';
    if (doneAgentIndices.has(i)) cls = 'done';
    else if (i === activeAgentIndex) cls = 'running';
    step.innerHTML = `<div class="pipe-node">
      <div class="pipe-circle ${cls}" style="${cls === 'done' ? '' : ''}">${a.icon}</div>
      <div class="pipe-label">${a.label}</div>
    </div>`;
    el.appendChild(step);
  });
}

// ── Sidebar leads ─────────────────────────────────
function renderLeads() {
  const el = document.getElementById('leads-list');
  el.innerHTML = '';
  leads.forEach(l => {
    const st = leadStatuses[l.id] || 'pending';
    const labels = { pending:'pending', running:'processing…', done:'complete', junk:'junk', review:'review' };
    const card = document.createElement('div');
    card.className = 'lead-card' + (selectedId === l.id ? ' active' : '') + (st === 'junk' ? ' junk' : '') + (st === 'done' ? ' done' : '');
    card.innerHTML = `
      <div class="lead-email">${l.email}</div>
      <div class="lead-name">${l.name || '(unknown name)'} · ${l.state || '?'}</div>
      <span class="lead-status status-${st}">${labels[st] || st}</span>`;
    card.onclick = () => {
      if (isRunning) return;
      selectedId = l.id;
      renderLeads();
      document.getElementById('run-hint').textContent = 'Click Run pipeline';
    };
    el.appendChild(card);
  });
}

// ── Run pipeline ──────────────────────────────────
async function runPipeline() {
  if (!selectedId) { document.getElementById('run-hint').textContent = '⚠ Select a lead first'; return; }
  const st = leadStatuses[selectedId];
  if (st === 'done' || st === 'junk') { document.getElementById('run-hint').textContent = 'Already processed — select another'; return; }
  if (isRunning) return;

  isRunning = true;
  activeAgentIndex = -1;
  doneAgentIndices = new Set();
  document.getElementById('run-btn').disabled = true;
  document.getElementById('run-hint').textContent = 'Pipeline running…';
  leadStatuses[selectedId] = 'running';
  renderLeads();

  const grid = document.getElementById('agent-grid');
  grid.innerHTML = '';

  const backendOnline = document.getElementById('backend-status').textContent.includes('connected');

  if (backendOnline) {
    await streamFromBackend(selectedId, grid);
  } else {
    await simulatePipeline(selectedId, grid);
  }
}

// ── Stream from real backend ──────────────────────
async function streamFromBackend(leadId, grid) {
  const evtSource = new EventSource(`${API}/pipeline/stream/${leadId}`);

  evtSource.onmessage = (e) => {
    const event = JSON.parse(e.data);
    handleEvent(event, grid, leadId);
    if (event.type === 'pipeline_done') {
      evtSource.close();
      finishPipeline(leadId, event.status === 'success');
    }
  };

  evtSource.onerror = () => {
    evtSource.close();
    document.getElementById('run-hint').textContent = 'Stream error — check backend';
    isRunning = false;
    document.getElementById('run-btn').disabled = false;
  };
}

// Agent block DOM management
const agentBlocks = {};

function getOrCreateBlock(agentId, grid) {
  if (agentBlocks[agentId]) return agentBlocks[agentId];
  const agent = AGENTS.find(a => a.id === agentId);
  if (!agent) return null;
  const block = document.createElement('div');
  block.className = 'agent-block active';
  block.id = `block-${agentId}`;
  block.innerHTML = `<div class="agent-head">
    <div class="agent-icon" style="background:${agent.color}22;color:${agent.color}">${agent.icon}</div>
    <div class="agent-name">${agent.label} agent</div>
    <span class="agent-badge badge-running" id="badge-${agentId}">running</span>
  </div>
  <div class="agent-logs" id="logs-${agentId}"></div>`;
  grid.appendChild(block);
  agentBlocks[agentId] = block;

  // Update pipeline
  const idx = AGENTS.findIndex(a => a.id === agentId);
  activeAgentIndex = idx;
  renderPipeline();

  return block;
}

function appendLog(agentId, msg, ok) {
  const logs = document.getElementById(`logs-${agentId}`);
  if (!logs) return;
  const now = new Date();
  const ts = now.toTimeString().slice(0,8);
  const dotCls = ok === false ? 'dot-wait' : ok === 'fail' ? 'dot-fail' : 'dot-ok';
  const row = document.createElement('div');
  row.className = 'log-row';
  row.innerHTML = `<span class="log-ts">${ts}</span><div class="log-dot ${dotCls}"></div><span class="log-msg ${ok === false ? 'dim' : ''}">${msg}</span>`;
  logs.appendChild(row);
  logs.scrollTop = logs.scrollHeight;
}

function markAgentDone(agentId, statusLabel, statusClass) {
  const block = agentBlocks[agentId];
  if (!block) return;
  block.className = `agent-block ${statusClass === 'badge-junk' ? 'done-junk' : 'done-ok'}`;
  const badge = document.getElementById(`badge-${agentId}`);
  if (badge) { badge.className = `agent-badge ${statusClass}`; badge.textContent = statusLabel; }

  const idx = AGENTS.findIndex(a => a.id === agentId);
  doneAgentIndices.add(idx);
  activeAgentIndex = -1;
  renderPipeline();
}

function appendDataGrid(agentId, fields) {
  const logs = document.getElementById(`logs-${agentId}`);
  if (!logs) return;
  const grid = document.createElement('div');
  grid.className = 'data-grid';
  fields.forEach(([k, v]) => {
    const cell = document.createElement('div');
    cell.className = 'data-cell';
    cell.innerHTML = `<div class="data-key">${k}</div><div class="data-val">${v}</div>`;
    grid.appendChild(cell);
  });
  logs.appendChild(grid);
}

function appendConfBar(agentId, pct) {
  const logs = document.getElementById(`logs-${agentId}`);
  if (!logs) return;
  const bar = document.createElement('div');
  bar.className = 'conf-bar';
  bar.innerHTML = `<div class="conf-fill" style="width:${pct}%"></div>`;
  logs.appendChild(bar);
  const lbl = document.createElement('div');
  lbl.style.cssText = 'font-family:var(--font-mono);font-size:10px;color:var(--muted);margin-top:4px';
  lbl.textContent = `Confidence: ${pct}%`;
  logs.appendChild(lbl);
}

function appendEmailPreview(agentId, subject, body) {
  const logs = document.getElementById(`logs-${agentId}`);
  if (!logs) return;
  const subj = document.createElement('div');
  subj.className = 'email-subject';
  subj.textContent = `Subject: ${subject}`;
  logs.appendChild(subj);
  const pre = document.createElement('div');
  pre.className = 'email-preview';
  pre.textContent = body;
  logs.appendChild(pre);
}

function handleEvent(event, grid, leadId) {
  const { type, agent } = event;

  if (type === 'agent_start') {
    getOrCreateBlock(agent, grid);
    return;
  }

  if (type === 'log') {
    getOrCreateBlock(agent, grid);
    appendLog(agent, event.message, event.ok !== false);
    return;
  }

  if (type === 'agent_result') {
    const data = event.data || {};
    const agentId = event.agent;

    // Post-process visuals per agent
    if (agentId === 'research_agent' && !data.is_junk) {
      appendDataGrid(agentId, [
        ['Name', `${data.first_name} ${data.last_name}`],
        ['Role', data.designation || '—'],
        ['District', data.district || '—'],
        ['Grade / Subject', `${data.grade} · ${data.subject}`],
      ]);
      appendConfBar(agentId, data.confidence || 0);
      markAgentDone(agentId, 'enriched', 'badge-ok');
    } else if (agentId === 'research_agent' && data.is_junk) {
      markAgentDone(agentId, 'no match', 'badge-junk');
    } else if (agentId === 'validation_agent') {
      const dec = data.decision;
      markAgentDone(agentId, dec, dec === 'junk' ? 'badge-junk' : dec === 'review' ? 'badge-review' : 'badge-ok');
    } else if (agentId === 'crm_agent') {
      appendDataGrid(agentId, [
        ['CRM ID', data.crm_id || '—'],
        ['Status', data.status || '—'],
        ['Source', data.source || '—'],
        ['Follow-up', data.follow_up || '—'],
      ]);
      markAgentDone(agentId, data.action || 'done', 'badge-ok');
    } else if (agentId === 'lumos_agent') {
      appendDataGrid(agentId, [
        ['Username', data.username || '—'],
        ['Password', data.password || '—'],
        ['Account type', data.account_type || '—'],
        ['Status', data.account_status || '—'],
      ]);
      markAgentDone(agentId, 'active', 'badge-ok');
    } else if (agentId === 'quote_agent') {
      appendDataGrid(agentId, [
        ['Quote ID', data.quote_id || '—'],
        ['Product', data.product || '—'],
        ['Price', data.price || '—'],
        ['Valid until', data.valid_until || '—'],
      ]);
      markAgentDone(agentId, 'ready', 'badge-ok');
      stats.quotes++;
      document.getElementById('stat-quotes').textContent = stats.quotes;
    } else if (agentId === 'qa_agent') {
      markAgentDone(agentId, data.decision || 'done', data.decision === 'approved' ? 'badge-ok' : 'badge-review');
    } else if (agentId === 'email_agent') {
      if (data.subject && data.body) {
        appendEmailPreview(agentId, data.subject, data.body);
      }
      markAgentDone(agentId, data.delivery_status || 'sent', 'badge-ok');
    } else {
      markAgentDone(agentId, 'done', 'badge-ok');
    }
    return;
  }

  if (type === 'agent_error') {
    const agentId = event.agent;
    getOrCreateBlock(agentId, grid);
    appendLog(agentId, event.message, 'fail');
    if (event.fatal) {
      markAgentDone(agentId, 'rejected', 'badge-junk');
    }
    return;
  }
}

function finishPipeline(leadId, success) {
  const newStatus = success ? 'done' : 'junk';
  leadStatuses[leadId] = newStatus;
  if (success) { stats.done++; document.getElementById('stat-done').textContent = stats.done; }
  else { stats.junk++; document.getElementById('stat-junk').textContent = stats.junk; }
  renderLeads();
  isRunning = false;
  document.getElementById('run-btn').disabled = false;
  document.getElementById('run-hint').textContent = success ? '✓ Complete' : '✗ Lead rejected';
  Object.keys(agentBlocks).forEach(k => delete agentBlocks[k]);
}

function resetAll() {
  if (isRunning) return;
  leads.forEach(l => leadStatuses[l.id] = 'pending');
  stats = { done: 0, junk: 0, quotes: 0 };
  selectedId = null;
  activeAgentIndex = -1;
  doneAgentIndices = new Set();
  document.getElementById('stat-done').textContent = 0;
  document.getElementById('stat-junk').textContent = 0;
  document.getElementById('stat-quotes').textContent = 0;
  document.getElementById('run-hint').textContent = 'Select a lead to begin';
  document.getElementById('run-btn').disabled = false;
  Object.keys(agentBlocks).forEach(k => delete agentBlocks[k]);
  renderPipeline();
  renderLeads();
  document.getElementById('agent-grid').innerHTML = `<div class="empty"><div class="empty-icon">⬡</div><div class="empty-text">select a lead → run pipeline</div></div>`;
}

// ── Demo simulation (offline mode) ───────────────
const DEMO_ENRICHED = {
  '1': { first_name:'Sarah', last_name:'Johnson', designation:'5th Grade Teacher', grade:'Grade 5', subject:'Math', school:'Barton Hills Elementary', district:'Austin ISD', org_type:'Public School', confidence:92, is_junk:false },
  '2': { is_junk:true, junk_reason:'Personal gmail with no school affiliation found after 3 search attempts.', confidence:12 },
  '3': { first_name:'Patricia', last_name:'Moore', designation:'District Administrator', grade:'K-12', subject:'All', school:'Norwalk Public Schools', district:'Norwalk Public Schools District', org_type:'Public School District', confidence:87, is_junk:false },
  '4': { first_name:'Deepa', last_name:'Patel', designation:'Curriculum Coordinator', grade:'K-8', subject:'ELA & Math', school:'Cleveland Metro Schools', district:'Cleveland Metropolitan School District', org_type:'Urban School District', confidence:95, is_junk:false },
  '5': { is_junk:true, junk_reason:'Personal hotmail with no school affiliation.', confidence:8 },
};

async function simulatePipeline(leadId, grid) {
  const lead = leads.find(l => l.id === leadId);
  const enriched = DEMO_ENRICHED[leadId] || {};
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  // 0 — Intake
  handleEvent({type:'agent_start', agent:'intake_agent'}, grid, leadId);
  await sleep(500); handleEvent({type:'log', agent:'intake_agent', message:'Connecting to Google Sheets API…', ok:false}, grid, leadId);
  await sleep(600); handleEvent({type:'log', agent:'intake_agent', message:'Connected. Reading row queue…', ok:true}, grid, leadId);
  await sleep(400); handleEvent({type:'log', agent:'intake_agent', message:`New lead detected: ${lead.email}`, ok:true}, grid, leadId);
  await sleep(300); handleEvent({type:'log', agent:'intake_agent', message:'Duplicate check passed ✓', ok:true}, grid, leadId);
  await sleep(200); handleEvent({type:'log', agent:'intake_agent', message:'Lead queued for enrichment pipeline.', ok:true}, grid, leadId);
  handleEvent({type:'agent_result', agent:'intake_agent', data:{status:'queued'}}, grid, leadId);
  markAgentDone('intake_agent','done','badge-ok');

  // 1 — Research
  await sleep(400);
  handleEvent({type:'agent_start', agent:'research_agent'}, grid, leadId);
  await sleep(400); handleEvent({type:'log', agent:'research_agent', message:`Analyzing domain: ${lead.email.split('@')[1]}`, ok:false}, grid, leadId);
  await sleep(600); handleEvent({type:'log', agent:'research_agent', message:'Querying educational directory patterns…', ok:false}, grid, leadId);
  await sleep(800); handleEvent({type:'log', agent:'research_agent', message:'Sending to Claude for enrichment analysis…', ok:false}, grid, leadId);
  await sleep(1200);

  if (enriched.is_junk) {
    handleEvent({type:'log', agent:'research_agent', message:'No school affiliation found in domain.', ok:false}, grid, leadId);
    handleEvent({type:'log', agent:'research_agent', message:`Junk reason: ${enriched.junk_reason}`, ok:false}, grid, leadId);
    handleEvent({type:'agent_result', agent:'research_agent', data:enriched}, grid, leadId);
  } else {
    handleEvent({type:'log', agent:'research_agent', message:`Extracted: ${enriched.first_name} ${enriched.last_name} — ${enriched.designation}`, ok:true}, grid, leadId);
    handleEvent({type:'log', agent:'research_agent', message:`School: ${enriched.school} · District: ${enriched.district}`, ok:true}, grid, leadId);
    handleEvent({type:'log', agent:'research_agent', message:`Confidence: ${enriched.confidence}%`, ok:true}, grid, leadId);
    handleEvent({type:'agent_result', agent:'research_agent', data:enriched}, grid, leadId);
  }

  // 2 — Validation
  await sleep(500);
  handleEvent({type:'agent_start', agent:'validation_agent'}, grid, leadId);
  await sleep(500); handleEvent({type:'log', agent:'validation_agent', message:'Applying lead validation rules…', ok:false}, grid, leadId);
  await sleep(600);

  if (enriched.is_junk) {
    handleEvent({type:'log', agent:'validation_agent', message:`Email domain: personal`, ok:false}, grid, leadId);
    handleEvent({type:'log', agent:'validation_agent', message:'No school affiliation confirmed.', ok:false}, grid, leadId);
    handleEvent({type:'log', agent:'validation_agent', message:'Lead marked JUNK. Pipeline halted.', ok:true}, grid, leadId);
    handleEvent({type:'agent_result', agent:'validation_agent', data:{decision:'junk'}}, grid, leadId);
    handleEvent({type:'agent_error', agent:'validation_agent', message:'Lead rejected as JUNK.', fatal:true}, grid, leadId);
    leadStatuses[leadId] = 'junk';
    stats.junk++;
    document.getElementById('stat-junk').textContent = stats.junk;
    renderLeads();
    isRunning = false;
    document.getElementById('run-btn').disabled = false;
    document.getElementById('run-hint').textContent = '✗ Lead rejected as junk';
    Object.keys(agentBlocks).forEach(k => delete agentBlocks[k]);
    return;
  }

  const leadType = enriched.designation.includes('District') || enriched.designation.includes('Coordinator') ? 'District Admin / Coordinator' : 'Teacher';
  handleEvent({type:'log', agent:'validation_agent', message:`Email domain: organizational ✓`, ok:true}, grid, leadId);
  handleEvent({type:'log', agent:'validation_agent', message:`Classified as: ${leadType}`, ok:true}, grid, leadId);
  handleEvent({type:'log', agent:'validation_agent', message:`Confidence ${enriched.confidence}% — above threshold ✓`, ok:true}, grid, leadId);
  handleEvent({type:'log', agent:'validation_agent', message:'Lead approved for CRM update.', ok:true}, grid, leadId);
  handleEvent({type:'agent_result', agent:'validation_agent', data:{decision:'approved', lead_type:leadType}}, grid, leadId);

  // 3 — CRM
  await sleep(500);
  handleEvent({type:'agent_start', agent:'crm_agent'}, grid, leadId);
  await sleep(500); handleEvent({type:'log', agent:'crm_agent', message:'Connecting to Vtiger CRM API…', ok:false}, grid, leadId);
  await sleep(700); handleEvent({type:'log', agent:'crm_agent', message:'Vtiger CRM connected ✓', ok:true}, grid, leadId);
  await sleep(400); handleEvent({type:'log', agent:'crm_agent', message:`Searching for existing record: ${lead.email}…`, ok:false}, grid, leadId);
  await sleep(600); handleEvent({type:'log', agent:'crm_agent', message:'No duplicate found — creating new contact…', ok:false}, grid, leadId);
  await sleep(700);
  const crmId = `VTG-${Math.floor(Math.random()*90000+10000)}`;
  handleEvent({type:'log', agent:'crm_agent', message:`CRM record created: ${crmId} ✓`, ok:true}, grid, leadId);
  handleEvent({type:'log', agent:'crm_agent', message:'All 14 fields populated. Activity log saved.', ok:true}, grid, leadId);
  handleEvent({type:'agent_result', agent:'crm_agent', data:{crm_id:crmId, action:'created', status:'New — Qualified', source:'Google Sheets / AI BDA', follow_up:_futureDate(3)}}, grid, leadId);

  // 4 — Lumos
  await sleep(500);
  handleEvent({type:'agent_start', agent:'lumos_agent'}, grid, leadId);
  await sleep(500); handleEvent({type:'log', agent:'lumos_agent', message:'Launching Playwright browser session…', ok:false}, grid, leadId);
  await sleep(600); handleEvent({type:'log', agent:'lumos_agent', message:'Navigating to Lumos signup page…', ok:false}, grid, leadId);
  await sleep(700); handleEvent({type:'log', agent:'lumos_agent', message:`Filling form: ${enriched.first_name} ${enriched.last_name} · ${enriched.school}`, ok:false}, grid, leadId);
  await sleep(800); handleEvent({type:'log', agent:'lumos_agent', message:'Form submitted. Email verification bypassed.', ok:true}, grid, leadId);
  await sleep(300); handleEvent({type:'log', agent:'lumos_agent', message:'Lumos admin account active ✓', ok:true}, grid, leadId);
  const pass = 'Lms#' + Math.random().toString(36).slice(2,8).toUpperCase();
  handleEvent({type:'agent_result', agent:'lumos_agent', data:{username:lead.email, password:pass, account_type:'Free Admin', account_status:'active'}}, grid, leadId);

  // 5 — Quote
  await sleep(500);
  handleEvent({type:'agent_start', agent:'quote_agent'}, grid, leadId);
  await sleep(500); handleEvent({type:'log', agent:'quote_agent', message:'Selecting product based on grade and role…', ok:false}, grid, leadId);
  await sleep(600); handleEvent({type:'log', agent:'quote_agent', message:'Applying pricing logic via Claude…', ok:false}, grid, leadId);
  await sleep(900);

  const isDistrict = enriched.org_type.includes('District') || enriched.designation.includes('Coordinator');
  const product = isDistrict ? 'Lumos District Suite — All Grades' : `Lumos Math & ELA — ${enriched.grade}`;
  const price = isDistrict ? '$18,500/year (district-wide)' : '$1,200/year (classroom)';
  const quoteId = `Q-${new Date().getFullYear()}-${Math.floor(Math.random()*9000+1000)}`;
  const stateNote = lead.state === 'TX' ? 'Aligned to STAAR standards.' : lead.state === 'OH' ? 'Aligned to Ohio AIR assessments.' : '';

  if (stateNote) handleEvent({type:'log', agent:'quote_agent', message:`State alignment: ${stateNote}`, ok:true}, grid, leadId);
  handleEvent({type:'log', agent:'quote_agent', message:`Product: ${product}`, ok:true}, grid, leadId);
  handleEvent({type:'log', agent:'quote_agent', message:`Quote ${quoteId} generated. PDF created.`, ok:true}, grid, leadId);
  handleEvent({type:'agent_result', agent:'quote_agent', data:{quote_id:quoteId, product, price, valid_until:_futureDate(30), state_note:stateNote}}, grid, leadId);

  // 6 — QA
  await sleep(500);
  handleEvent({type:'agent_start', agent:'qa_agent'}, grid, leadId);
  await sleep(500); handleEvent({type:'log', agent:'qa_agent', message:'Running QA verification checks…', ok:false}, grid, leadId);
  await sleep(400); handleEvent({type:'log', agent:'qa_agent', message:`CRM record confirmed: ${crmId} ✓`, ok:true}, grid, leadId);
  await sleep(300); handleEvent({type:'log', agent:'qa_agent', message:'Lumos account active and verified ✓', ok:true}, grid, leadId);
  await sleep(300); handleEvent({type:'log', agent:'qa_agent', message:`Quote ${quoteId} PDF accessible ✓`, ok:true}, grid, leadId);
  await sleep(300); handleEvent({type:'log', agent:'qa_agent', message:`Confidence ${enriched.confidence}% — no human review needed ✓`, ok:true}, grid, leadId);
  handleEvent({type:'agent_result', agent:'qa_agent', data:{decision:'approved', confidence:enriched.confidence}}, grid, leadId);

  // 7 — Email
  await sleep(500);
  handleEvent({type:'agent_start', agent:'email_agent'}, grid, leadId);
  await sleep(500); handleEvent({type:'log', agent:'email_agent', message:'Generating personalized email via Claude…', ok:false}, grid, leadId);
  await sleep(1000);

  const sNote = lead.state === 'TX' ? ' I noticed your district uses STAAR assessments — our platform aligns directly to STAAR standards.' : lead.state === 'OH' ? ' Our content maps to Ohio\'s AIR assessments.' : '';
  const emailBody = `Hi ${enriched.first_name},

I hope this finds you well! My name is Alex Rivera and I work with Lumos Learning.

I came across your profile and wanted to reach out — we work with educators at ${enriched.school} to help students build key skills through adaptive, standards-aligned practice.${sNote}

I've put together a quote tailored for you — Quote #${quoteId} for ${product} at ${price}. I've attached it to this email.

Your free admin account is already set up at lumoslearning.com so you can explore the platform right now.

Would you have 15 minutes sometime this week for a quick call? I'd love to show you what other teachers in your district are seeing.

Warm regards,
Alex Rivera | Lumos Learning BDA
alex.rivera@lumoslearning.com`;

  const emailSubject = `Personalized Lumos Quote for ${enriched.school}`;

  handleEvent({type:'log', agent:'email_agent', message:`Draft ready: "${emailSubject}"`, ok:true}, grid, leadId);
  handleEvent({type:'log', agent:'email_agent', message:`PDF ${quoteId}.pdf attached ✓`, ok:true}, grid, leadId);
  handleEvent({type:'log', agent:'email_agent', message:'Email logged (SMTP not configured — demo mode).', ok:true}, grid, leadId);
  handleEvent({type:'log', agent:'email_agent', message:'CRM log updated. Follow-up: Day 3.', ok:true}, grid, leadId);
  handleEvent({type:'agent_result', agent:'email_agent', data:{subject:emailSubject, body:emailBody, delivery_status:'demo_logged'}}, grid, leadId);

  finishPipeline(leadId, true);
}

function _futureDate(days) {
  const d = new Date(); d.setDate(d.getDate() + days);
  return d.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
}
